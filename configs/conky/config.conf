conky.config = {
  alignment = 'top_left',
  update_interval = 1,

  -- КЛЮЧЕВОЕ: своё окно на desktop-слое, прозрачно
  own_window = true,
  own_window_type = 'override',      -- вариант 'dock' тоже можно попробовать
  own_window_transparent = true,
  own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager,below',

  use_xft = true,
  font = 'monospace:size=12',
  double_buffer = true,

  gap_x = 20,
  gap_y = 40,
  minimum_width = 220,
  draw_shades = false,
  draw_outline = false,
  draw_borders = false,
  default_color = 'white',
}

conky.text = [[
${color grey}IP:${color} ${addr wlan0}
${color grey}CPU Load:${color} ${loadavg 1}
${color grey}RAM:${color} $mem / $memmax
${color grey}Disk:${color} ${fs_used /} / ${fs_size /}
${color grey}Time:${color} ${time %H:%M:%S}
]]